name: Build, Test and Package (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path -Path 'requirements.txt') {
            python -m pip install -r requirements.txt
          } else {
            python -m pip install pytest pyinstaller
          }

      - name: Run tests
        shell: pwsh
        run: |
          Write-Host "Running all tests from repository root..."
          python -m pytest -q .

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          # Clean old builds
          if (Test-Path -Path 'build') { Remove-Item -Recurse -Force build }
          if (Test-Path -Path 'dist')  { Remove-Item -Recurse -Force dist }
          # if (Test-Path -Path '.\CombinedApp.spec') { Remove-Item -Force .\CombinedApp.spec -ErrorAction SilentlyContinue }

          # Automatically detect all Python modules recursively
          $hiddenImports = @()
          foreach ($dir in @("apps","base_classes","controllers", "instruments", "models", "utils", "views")) {
              if (Test-Path $dir) {
                  Get-ChildItem -Path $dir -Recurse -File -Filter "*.py" | ForEach-Object {
                      if ($_.Name -ne "__init__.py") {
                          $relativePath = $_.FullName.Substring($PWD.Path.Length + 1)
                          $module = $relativePath.Replace("\", ".").Replace(".py","")
                          $hiddenImports += "--hidden-import=$module"
                      }
                  }
              }
          }

          $hiddenString = $hiddenImports -join " "
          Write-Host "Detected hidden imports: $hiddenString"

          # Build the EXE
          pyinstaller --onedir --windowed --paths=. --icon=icon.ico .\apps\CombinedApp.py --exclude PyQt5
          
          # Copy input_files folder and icon.png into dist
          Copy-Item -Recurse -Force "input_files" "dist\"
          Copy-Item -Force "icon.png" "dist\"

      - name: Rename dist folder with date, copy additional files
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $newName = "CombinedApp$($date)"
          Rename-Item -Path "dist\CombinedApp" -NewName $newName
          echo "NEW_DIST_FOLDER=$newName" >> $env:GITHUB_ENV

      - name: List dist contents
        shell: pwsh
        run: |
          if (Test-Path -Path 'dist') {
            Get-ChildItem -Recurse -Force dist | Select-Object FullName, Length
          } else {
            Write-Host "No dist folder produced."
          }

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NEW_DIST_FOLDER }}
          path: dist
